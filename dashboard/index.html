<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moto resources</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%231D2023'/%3E%3Cpath fill='%23F6C700' d='M12 12V1.5A10.5 10.5 0 0 1 22.5 12zM12 12v10.5A10.5 10.5 0 0 1 1.5 12z'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint
      try {
        var theme = JSON.parse(localStorage.getItem("moto-theme"));
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>This page needs JavaScript. The raw data is at /moto-api/data.json.</noscript>
  </body>
</html>
